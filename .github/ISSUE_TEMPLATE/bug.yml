name: Bug report
description: Report incorrect skill behavior or a broken repository artifact
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the incorrect behavior without private data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include host, model/version, operating system, prompt, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Do not include credentials, private paths, user conversations, proprietary source, or third-party screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, private user data, local paths, and proprietary assets.
          required: true
